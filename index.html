<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martin Wöllenstein</title>
    <style>
        @font-face {
            font-family: 'Unica';
            src: url('./HGKBUnica77VIPBeta.ttf') format('truetype');
            font-style: normal;
        }

        @font-face {
            font-family: 'Source';
            src: url('./SourceSerifVariable-Roman.otf') format('opentype');
            font-style: normal;
        }

        :root {
            --font-ui: 'Unica', sans-serif;
            --font-body: 'Source', serif;
            --fv-ui: 'wght' 90;
            --fv-ui_active: 'wght' 110;
            --fv-body: 'wght' 500;

            --size-ui: 24px;
            --size-ui-md: 24px;
            --size-ui-sm: 24px;
            --bar-h: 48px;
            --size-label: 14px;
            --ls-label: 0.05em;
            --size-body: 24px;

            --c-artwork: #e9fe53;
            --c-exhibition: #f8e589;
            --c-research: #e6803c;
            --c-design: #db5626;
            --c-curating: #ae501f;
            --c-teaching: #673110;
            --c-publication: #200e02;
            --c-event: #0e1188;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        button {
            -webkit-appearance: none;
            appearance: none;
            color: inherit;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: var(--font-ui);
            font-size: var(--size-ui);
            font-variation-settings: var(--fv-ui);
            color: #000;
            background: #fff;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        @supports (-webkit-hyphens: none) {
            :root {
                --fv-ui: 'wght' 100;
                --fv-body: 'wght' 420;
            }
        }

        /* ── LAYOUT ── */
        #shell {
            display: flex;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        .col {
            overflow: hidden;
            flex-shrink: 0;
            transition: width 0.35s ease;
            background: #fff;
        }

        /* starting state: col-1 full width, col-2 hidden */
        #col-1 {
            width: 100%;
        }

        #col-2 {
            width: 0;
            overflow: hidden;
            position: relative;
        }

        /* open state: project panel slides in */
        #col-1.open {
            width: 40%;
        }

        #col-2.open {
            width: 60%;
            overflow-y: auto;
        }

        #col-2.open .project {
            min-height: calc(100vh - var(--bar-h));
            display: flex;
            flex-direction: column;
        }

        .project-spacer {
            flex: 1;
            min-height: 20vh;
        }

        #col-2.about #about-content {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #col-2.about .project-spacer {
            flex: 1;
            min-height: 20vh;
        }

        /* about: project list hides, col-2 goes full width */
        #col-1.about {
            width: 0;
        }

        #col-2.about {
            width: 100%;
            overflow-y: auto;
        }

        .about-back-btn {
            font-family: var(--font-ui);
            font-size: var(--size-ui-md);
            font-variation-settings: var(--fv-ui);
            background: none;
            border: none;
            cursor: pointer;
            padding: 0 25px;
            display: flex;
            align-items: center;
        }





        /* resize handle */
        .handle {
            /* width: 9px; */
            flex-shrink: 0;
            cursor: col-resize;
            background: transparent;
            display: block;
            z-index: 10;
            position: relative;
        }

        .handle::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            width: 1px;
            background: #000;
        }

        /* ── COL-1 ── */
        #col-1-inner {
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
        }

        #col-1-header {
            display: flex;
            align-items: stretch;
            height: var(--bar-h);
            border-bottom: 1px solid #000;
            position: sticky;
            top: 0;
            z-index: 10;
            background: #fff;
        }

        #site-title {
            font-family: var(--font-ui);
            font-size: var(--size-ui);
            font-variation-settings: var(--fv-ui);
            cursor: pointer;
            width: 260px;
            flex-shrink: 0;
            flex-grow: 0;
            display: flex;
            align-items: center;
            padding: 12px 25px;
            white-space: nowrap;
            overflow: hidden;
        }

        /* ── BOLD-HOVER: inner span starts normal, transitions to bold ── */
        #site-title span {
            font-variation-settings: var(--fv-ui);
            transition: font-variation-settings 0.2s ease, letter-spacing 0.2s ease;
        }


        #header-about {
            font-family: var(--font-ui);
            font-size: var(--size-ui);
            font-variation-settings: var(--fv-ui);
            background: none;
            border: none;
            cursor: pointer;
            padding: 12px 25px;
            width: 140px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            white-space: nowrap;
            transition: font-variation-settings 0.2s ease, letter-spacing 0.2s ease;
            margin-left: 20px;
        }


        #filters {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: stretch;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .tag {
            font-family: var(--font-ui);
            font-size: var(--size-ui-sm);
            font-variation-settings: var(--fv-ui);
            border: none;
            cursor: pointer;
            padding: 0 12px;
            display: inline-grid;
            align-items: center;
            justify-items: center;
            background: #fff;
            color: #000;
            transition: font-variation-settings 0.1s ease;
            white-space: nowrap;
        }

        /* both the visible text and the bold ghost occupy the same grid cell —
           ghost is invisible but reserves the bold width so layout never shifts */
        .tag-full,
        .tag-bold-ghost {
            grid-area: 1 / 1;
        }

        .tag-bold-ghost {
            font-variation-settings: var(--fv-ui_active);
            visibility: hidden;
            user-select: none;
            pointer-events: none;
        }

        /* .tag:hover {
            font-variation-settings: var(--fv-ui_active);


        } */












        .tag[data-tag="Artwork"].active {
            background: var(--c-artwork);
            color: #000;
        }

        .tag[data-tag="Exhibition"].active {
            background: var(--c-exhibition);
            color: #000;
        }

        .tag[data-tag="Research"].active {
            background: var(--c-research);
            color: #fff;
        }

        .tag[data-tag="Design"].active {
            background: var(--c-design);
            color: #fff;
        }

        .tag[data-tag="Curating"].active {
            background: var(--c-curating);
            color: #fff;
        }

        .tag[data-tag="Teaching"].active {
            background: var(--c-teaching);
            color: #fff;
        }

        .tag[data-tag="Publication"].active {
            background: var(--c-publication);
            color: #fff;
        }

        .tag[data-tag="Event"].active {
            background: var(--c-event);
            color: #fff;
        }

        /* collapsed 1-letter mode when project panel is open */
        .tag-short {
            display: none;
        }

        #col-1.open .tag-full,
        #col-1.open .tag-bold-ghost {
            display: none;
        }

        #col-1.open .tag-short {
            display: block;
        }

        #col-1.open .tag {
            flex: 1;
            padding: 0;
            justify-content: center;
        }

        #col-1.open #site-title {
            width: 260px;
            flex-shrink: 0;
            padding: 12px 25px;
        }

        #col-1.open #header-about {
            width: auto;
            flex-shrink: 1;
            min-width: 0;
        }

        #col-1.open #filters {
            flex: 1;
            min-width: 0;
        }

        /* project rows */
        .proj-row {
            display: grid;
            grid-template-columns: 50% 25% 15% 10%;
            align-items: stretch;
            height: var(--bar-h);
            border-bottom: 1px solid #000;
            cursor: pointer;
            position: relative;
        }

        .proj-row {
            transition: height 0.2s ease, opacity 0.18s ease;
        }

        .proj-row.filtered {
            height: 0 !important;
            min-height: 0 !important;
            opacity: 0;
            pointer-events: none;
            overflow: hidden;
            border-bottom: none;
        }

        .proj-row.active {
            background: #000;
            color: #fff;
        }

        .proj-name,
        .proj-location,
        .proj-year {
            font-family: var(--font-ui);
            font-size: var(--size-ui-sm);
            font-variation-settings: var(--fv-ui);
            padding: 0 25px;
            display: flex;
            align-items: center;
            transition: font-variation-settings 0.2s ease, letter-spacing 0.2s ease;
        }

        .proj-location,
        .proj-year {
            transition: font-variation-settings 0.2s ease, letter-spacing 0.2s ease, transform 0.3s ease, opacity 0.3s ease;
        }


        .proj-name {
            overflow: hidden;
            min-width: 0;
            position: relative;
            transition: padding-left 0.1s ease;
        }

        .proj-name::before {
            content: '';
            position: absolute;
            left: 25px;
            top: 50%;
            transform: translateY(-50%);
            width: 9px;
            height: 16px;
            clip-path: polygon(0 0, 100% 50%, 0 100%);
            background: currentColor;
            opacity: 0;
            transition: opacity 0.1s ease;
        }


        .proj-row.active .proj-name {
            padding-left: 49px;
        }

        .proj-row.active .proj-name::before {
            opacity: 1;
        }

        .proj-name-text {
            display: block;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        /* .proj-location {
            padding-left: 0;
        } */

        .proj-year {
            padding-left: 0;
            /* justify-content: flex-end; */
            padding-right: 0;
        }

        /* narrow panel: name + color blocks */
        #col-1.open .proj-row {
            grid-template-columns: 1fr 0 0 66px;
        }

        #col-1.open .proj-tags {
            padding-right: 0;
        }

        #col-1.open .proj-location,
        #col-1.open .proj-year {
            opacity: 0;
            transform: translateX(30px);
            pointer-events: none;
            overflow: hidden;
        }

        #col-1.open #filters {
            opacity: 0;
            transform: translateX(30px);
            pointer-events: none;
        }

        .proj-num {
            display: none;
        }

        #col-1.open .proj-row.active .proj-tag-block {
            display: none;
        }

        .proj-tags {
            display: flex;
            align-items: stretch;
            justify-content: flex-end;
            padding-right: 25px;
        }

        .proj-tag-block {
            width: 26px;
            flex-shrink: 0;
            transition: width 0.1s ease, opacity 0.15s ease;
        }


        .proj-row.active .proj-tag-block {
            opacity: 0;
        }

        /* ── COL-2 ── */
        #case-topbar {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            height: var(--bar-h);
            border-bottom: 1px solid #000;
        }

        #case-topbar-row {
            display: contents;
        }

        #case-back {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            width: var(--bar-h);
            flex-shrink: 0;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #case-back::before {
            content: '';
            width: 9px;
            height: 16px;
            clip-path: polygon(100% 0, 0 50%, 100% 100%);
            background: currentColor;
        }

        .case-back-label {
            display: none;
        }

        #case-title {
            font-family: var(--font-ui);
            font-size: var(--size-ui);
            font-variation-settings: var(--fv-ui);
            display: flex;
            align-items: center;
            padding: 12px 25px;
        }


        #case-filters {
            display: flex;
            align-items: stretch;
            order: 1;
        }

        .case-filter {
            font-family: var(--font-ui);
            font-size: var(--size-ui-sm);
            font-variation-settings: var(--fv-ui);
            border: none;
            cursor: pointer;
            padding: 0 18px;
            display: flex;
            align-items: center;
            background: #fff;
            color: #000;

            transition: font-variation-settings 0.1s ease, opacity 0.1s ease;
            white-space: nowrap;
        }


        .case-filter.active {
            background: #000;
            color: #fff;
        }

        .case-filter {
            display: inline-grid;
        }

        .cf-text,
        .cf-ghost {
            grid-area: 1 / 1;
        }

        .cf-ghost {
            font-variation-settings: var(--fv-ui_active);
            visibility: hidden;
            user-select: none;
            pointer-events: none;
        }

        /* ── BLOCKS ── */
        .block-text {
            margin-bottom: -1px;
        }

        .block-description {
            font-family: var(--font-ui);
            font-size: var(--size-label);
            font-variation-settings: var(--fv-ui);
            padding: 12px 25px 8px 25px;
            letter-spacing: var(--ls-label);
            width: 100%;
            border-top: 1px solid #000;
        }

        .block-images .block-description {
            border-top: none;
            padding-left: 0;
            padding-right: 0;
        }

        .block-title {
            font-family: var(--font-ui);
            font-size: var(--size-label);
            font-variation-settings: var(--fv-ui);
            padding: 12px 25px 8px 25px;
            border-top: 1px solid #000;
            letter-spacing: var(--ls-label);
        }

        .project> :first-child>.block-title:first-child,
        .project>.block-title:first-child,
        .project>.block-images:first-child,
        .project> :first-child>.block-description:first-child,
        .project>.block-description:first-child {
            border-top: none;
        }

        #about-content .block-title:first-of-type {
            border-top: none;
        }

        /* ── CREDITS BLOCK ── */
        .block-credits .block-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding: 0 25px 12px 25px;
            font-family: var(--font-body);
            font-size: var(--size-body);
            font-variation-settings: var(--fv-body);
            line-height: 1.2;
        }

        .block-image-title {
            font-family: var(--font-ui);
            font-size: var(--size-label);
            font-variation-settings: var(--fv-ui);
            letter-spacing: var(--ls-label);
            padding: 6px 25px 3px 0px;
            width: 100%;
        }

        .block-text .block-body {
            font-family: var(--font-body);
            font-size: var(--size-body);
            font-variation-settings: var(--fv-body);
            line-height: 1.2;
            padding: 0 75px 12px 25px;
        }

        .block-text .block-body p {
            margin-bottom: 12px;
        }

        .block-text .block-body p:last-child {
            margin-bottom: 0;
        }

        .block-images {
            margin-top: -1px;
            position: relative;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            /* gap: 5px; */
            padding: 0px 25px 0px 25px;
            flex-wrap: wrap;
            border-top: 1px solid #000;
        }

        .block-images .img-wrap {
            height: 400px;
            overflow: hidden;
            background: #f0f0f0;
            flex-shrink: 0;
        }

        .block-images .img-wrap img {
            height: 100%;
            width: auto;
            display: block;
            object-fit: contain;
        }


        .block.hidden {
            display: none;
        }


        .project-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: var(--bar-h);
            padding: 0 25px;
            /* border-top: 1px solid #000; */
            font-family: var(--font-ui);
            font-size: var(--size-label);
            font-variation-settings: var(--fv-ui);
            letter-spacing: var(--ls-label);
            color: #000000;
            margin-top: auto;
        }

        /* ── ABOUT ── */
        #case-empty {
            font-family: var(--font-ui);
            font-size: var(--size-ui);
            font-variation-settings: var(--fv-ui);
        }

        .about-heading {
            font-family: var(--font-ui);
            font-size: var(--size-ui);
            font-variation-settings: var(--fv-ui);
            padding: 12px 25px;
        }

        .about-body {
            font-family: var(--font-body);
            font-size: var(--size-body);
            font-variation-settings: var(--fv-body);
            line-height: 1.2;
            padding: 0 25px 25px 25px;
        }

        .about-body p {
            margin-bottom: 16px;
        }

        .about-body p:last-child {
            margin-bottom: 0;
        }

        .about-list {
            font-family: var(--font-body);
            font-size: var(--size-body);
            font-variation-settings: var(--fv-body);
            line-height: 1.3;
            padding: 0 25px 25px 25px;
        }

        .about-list p {
            margin-bottom: 0;
        }

        .about-grid {
            display: flex;
            flex-direction: column;
        }

        .about-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            border-top: 1px solid #000;
        }

        .about-col {
            min-width: 0;
        }

        .about-col .block-title {
            border-top: none;
        }

        .about-col-image img {
            width: 20vw;
            height: auto;
            display: block;
            margin: 0 25px 0px 25px;
        }

        .about-exhibitions {
            font-family: var(--font-body);
            font-size: var(--size-body);
            font-variation-settings: var(--fv-body);
            line-height: 1.2;
            padding: 0 25px 25px 25px;
            display: flex;
            flex-direction: column;
        }

        .about-links {
            padding: 0 25px 25px 25px;
            font-family: var(--font-ui);
            font-size: var(--size-ui);
            font-variation-settings: var(--fv-ui);
            display: flex;
            flex-direction: column;
            /* gap: 6px; */
            line-height: 1.2;
        }

        .about-links a {
            color: #000;
            text-decoration: none;
            font-family: var(--font-body);
            font-size: var(--size-body);
            font-variation-settings: var(--fv-body);
            position: relative;
            padding-left: 0;
            transition: padding-left 0.1s ease;
        }

        .about-links a::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 6px;
            height: 11px;
            clip-path: polygon(0 0, 100% 50%, 0 100%);
            background: currentColor;
            opacity: 0;
            transition: opacity 0.1s ease;
        }


        .about-cv-btn {
            font-family: var(--font-ui);
            font-size: var(--size-ui-md);
            font-variation-settings: var(--fv-ui);
            background: none;
            color: #000;
            border: none;
            cursor: pointer;
            padding: 0 25px;
            display: flex;
            align-items: center;
            text-decoration: none;
            transition: font-variation-settings 0.2s ease, letter-spacing 0.2s ease;
        }


        #about-header {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            height: var(--bar-h);
            /* border-bottom: 1px solid #000; */
        }

        #about-header+.block-title {
            border-top: none;
        }

        /* ── DARK MODE TOGGLE BUTTON ── */
        #dark-mode-btn {
            border: none;
            cursor: pointer;
            padding: 0;
            width: var(--bar-h);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            color: #000;
        }





        body.dark,
        body.dark .col,
        body.dark #shell {
            background: #000;
            color: #fff;
        }

        body.dark #col-1-header {
            background: #000;
        }

        body.dark * {
            border-color: #fff !important;
        }

        body.dark .handle::after {
            background: #fff;
        }

        body.dark .tag {
            background: #000;
            color: #fff;
        }

        body.dark .case-filter {
            background: #000;
            color: #fff;
        }

        body.dark .case-filter.active {
            background: #fff;
            color: #000;
        }

        body.dark .proj-row.active {
            background: #fff;
            color: #000;
        }

        body.dark .about-cv-btn,
        body.dark .about-back-btn {
            color: #fff;
        }

        body.dark .about-links a {
            color: #fff;
        }

        body.dark .project-footer {
            color: #fff;
        }

        body.dark .block-images .img-wrap {
            background: #222;
        }

        body.dark #dark-mode-btn {
            background: #000;
            color: #fff;
        }



        body.dark #case-back,
        body.dark .case-back-label,
        body.dark #case-title {
            color: #fff;
        }

        body.dark #header-about {
            color: #fff;
        }
    


        /* ── HOVER (pointer devices only) ── */
        @media (hover: hover) {
            .about-back-btn:hover,
            #header-about:hover,
            .about-cv-btn:hover {
                font-variation-settings: var(--fv-ui_active);
                letter-spacing: -0.0075em;
            }
            #site-title:hover span {
                font-variation-settings: var(--fv-ui_active);
                letter-spacing: -0.0075em;
            }
            .tag[data-tag="Artwork"]:hover { background: var(--c-artwork); color: #000; }
            .tag[data-tag="Exhibition"]:hover { background: var(--c-exhibition); color: #000; }
            .tag[data-tag="Research"]:hover { background: var(--c-research); color: #fff; }
            .tag[data-tag="Design"]:hover { background: var(--c-design); color: #fff; }
            .tag[data-tag="Curating"]:hover { background: var(--c-curating); color: #fff; }
            .tag[data-tag="Teaching"]:hover { background: var(--c-teaching); color: #fff; }
            .tag[data-tag="Publication"]:hover { background: var(--c-publication); color: #fff; }
            .tag[data-tag="Event"]:hover { background: var(--c-event); color: #fff; }
            .tag:hover .tag-full { font-variation-settings: var(--fv-ui_active); }
            .proj-row:hover .proj-name,
            .proj-row:hover .proj-location,
            .proj-row:hover .proj-year {
                font-variation-settings: var(--fv-ui_active);
                letter-spacing: -0.0075em;
            }
            .proj-row:hover .proj-location,
            .proj-row:hover .proj-year { transform: translateX(25px); }

    <script>
        const SANITY_PROJECT_ID = '1uk7glr5';
        const SANITY_DATASET = 'production';
        const SANITY_TOKEN = 'skJgM39jVueFEVB1dFkXRgceCeFogPCuGtrXD9O69qrRhTdho5kHHHcOO0mX1hh1p5N1yDa6hklDWTMzWmefVheY2hfZzVE5X2U6gF4eIetu57fiQZ9yzAGmNpd7PqZuQZCG5xceIC6wqIEgmDnbYkVa3ZWWrb5PTDDZNzp1Y9Hf189YWwu2';

        const TAG_ORDER = ['Artwork', 'Exhibition', 'Research', 'Design', 'Curating', 'Teaching', 'Publication', 'Event'];
        const tagColors = {
            Artwork: 'var(--c-artwork)', Exhibition: 'var(--c-exhibition)', Research: 'var(--c-research)',
            Design: 'var(--c-design)', Curating: 'var(--c-curating)', Teaching: 'var(--c-teaching)',
            Publication: 'var(--c-publication)', Event: 'var(--c-event)'
        };

        let sections = [];
        let activeIndex = null;
        let previousIndex = null;
        const activeTags = new Set();
        const rowGen = new Map();

        function toggleDark() {
            document.body.classList.toggle('dark');
        }

        // SANITY
        function sanityImageUrl(ref) {
            return `https://cdn.sanity.io/images/${SANITY_PROJECT_ID}/${SANITY_DATASET}/${ref.replace('image-', '').replace(/-(\w+)$/, '.$1')}`;
        }

        function sanityFileUrl(ref) {
            return `https://cdn.sanity.io/files/${SANITY_PROJECT_ID}/${SANITY_DATASET}/${ref.replace('file-', '').replace(/-(\w+)$/, '.$1')}`;
        }

        async function fetchAbout() {
            const query = encodeURIComponent('*[_type == "about"][0]');
            const url = `https://${SANITY_PROJECT_ID}.api.sanity.io/v2021-10-21/data/query/${SANITY_DATASET}?query=${query}`;
            const res = await fetch(url, { headers: { Authorization: `Bearer ${SANITY_TOKEN}` } });
            const data = await res.json();
            return data.result;
        }

        function renderAboutCol(block) {
            const title = block.title ? `<div class="block-title">${block.title}</div>` : '';

            if (block._type === 'textBlock') {
                const paras = (block.content || '').split('\n').filter(l => l.trim()).map(l => `<p>${l}</p>`).join('');
                return `<div class="about-col">${title}<div class="about-body">${paras}</div></div>`;
            }

            if (block._type === 'photoBlock') {
                const ref = block.image?.asset?._ref || '';
                const src = ref ? sanityImageUrl(ref) : '';
                return `<div class="about-col about-col-image">${title}${src ? `<img src="${src}" alt="">` : ''}</div>`;
            }

            if (block._type === 'listBlock') {
                const paras = (block.content || '').split('\n').filter(l => l.trim()).map(l => `<p>${l}</p>`).join('');
                return `<div class="about-col">${title}<div class="about-list">${paras}</div></div>`;
            }

            if (block._type === 'linksBlock') {
                const links = (block.links || []).map(l => `<a href="${l.url}">${l.label}</a>`).join('');
                return `<div class="about-col">${title}<div class="about-links">${links}</div></div>`;
            }

            return '<div class="about-col"></div>';
        }

        function populateAbout(about) {
            if (!about) return;

            if (about.cv?.asset?._ref) {
                const cvBtn = document.querySelector('.about-cv-btn');
                if (cvBtn) cvBtn.href = sanityFileUrl(about.cv.asset._ref);
            }

            const grid = document.querySelector('.about-grid');
            if (!grid) return;
            grid.innerHTML = '';

            const blocks = about.blocks || [];
            for (let i = 0; i < blocks.length; i += 2) {
                const row = document.createElement('div');
                row.className = 'about-row';
                row.innerHTML = renderAboutCol(blocks[i]) +
                    (blocks[i + 1] ? renderAboutCol(blocks[i + 1]) : '<div class="about-col"></div>');
                grid.appendChild(row);
            }
        }

        async function fetchProjects() {
            const query = encodeURIComponent('*[_type == "project"] | order(year desc)');
            const url = `https://${SANITY_PROJECT_ID}.api.sanity.io/v2021-10-21/data/query/${SANITY_DATASET}?query=${query}`;
            const res = await fetch(url, { headers: { Authorization: `Bearer ${SANITY_TOKEN}` } });
            const data = await res.json();
            return data.result;
        }

        function renderBlock(block) {
            if (block._type === 'textBlock') {
                const paras = (block.body || '').split('\n').filter(l => l.trim())
                    .map(l => `<p>${l}</p>`).join('');
                return `<div class="block block-text" data-type="text">
                    ${block.description ? `<div class="block-description">${block.description}</div>` : ''}
                    <div class="block-body">${paras}</div>
                </div>`;
            }
            if (block._type === 'creditsBlock') {
                const items = (block.body || '').split('\n').filter(l => l.trim())
                    .map(l => `<span>${l}</span>`).join('');
                return `<div class="block block-credits" data-type="credits">
                    ${block.description ? `<div class="block-description">${block.description}</div>` : ''}
                    <div class="block-body">${items}</div>
                </div>`;
            }
            if (block._type === 'imageBlock') {
                const imgs = (block.images || []).map(img => {
                    const ref = img.image?.asset?._ref || img.asset?._ref;
                    if (!ref) return '';
                    return `${img.caption ? `<div class="block-image-title">${img.caption}</div>` : ''}
                        <div class="img-wrap"><img src="${sanityImageUrl(ref)}" alt=""></div>`;
                }).join('');
                return `<div class="block block-images" data-type="images">
                    ${block.description ? `<div class="block-description">${block.description}</div>` : ''}
                    ${imgs}
                </div>`;
            }
            return '';
        }

        /* ── INIT: fetch from Sanity, render, then set up sidebar ── */
        async function init() {
            const projects = await fetchProjects();
            const content = document.getElementById('projects-content');

            projects.forEach(p => {
                const el = document.createElement('section');
                el.className = 'project';
                el.dataset.name = p.name || '';
                el.dataset.location = p.city || '';
                el.dataset.year = p.year || '';
                el.dataset.tags = JSON.stringify(p.tags || []);
                el.innerHTML = (p.blocks || []).map(renderBlock).join('');
                content.appendChild(el);
            });

            sections = Array.from(document.querySelectorAll('.project'));
            sections.forEach((s, i) => {
                s.style.display = 'none';
                const num = String(sections.length - i).padStart(2, '0');
                const tags = JSON.parse(s.dataset.tags || '[]').join(', ');
                s.insertAdjacentHTML('beforeend', `
                    <div class="project-spacer"></div>
                    <div class="project-footer">
                        <span><a href="https://creativecommons.org/licenses/by-nc-nd/4.0/deed.en" target="_blank" rel="noopener">CC</a> BY-NC-ND Martin Wöllenstein</span>
                        <span>${tags}</span>
                    </div>`);
            });

            document.getElementById('about-content').insertAdjacentHTML('beforeend', `
                <div class="project-spacer"></div>
                <div class="project-footer">
                   
                    <span><a href="https://creativecommons.org/licenses/by-nc-nd/4.0/deed.en" target="_blank" rel="noopener">CC</a> BY-NC-ND Martin Wöllenstein</span>
                     <span>Updated 2026</span>
                </div>`);

            document.getElementById('projects-list').innerHTML = sections.map((s, i) => {
                const tags = JSON.parse(s.dataset.tags || '[]')
                    .sort((a, b) => TAG_ORDER.indexOf(a) - TAG_ORDER.indexOf(b))
                    .slice(0, 3);
                const tagBlocks = tags.map(t =>
                    `<span class="proj-tag-block" data-tag="${t}" style="background:${tagColors[t] || 'transparent'}"></span>`
                ).join('');
                const num = String(sections.length - i).padStart(2, '0');
                return `<div class="proj-row" data-index="${i}" onclick="openProject(${i})">
                    <span class="proj-name"><span class="proj-name-text">${s.dataset.name}</span></span>
                    <span class="proj-location">${s.dataset.location || ''}</span>
                    <span class="proj-year">${s.dataset.year}</span>
                    <span class="proj-tags">${tagBlocks}<span class="proj-num">${num}</span></span>
                </div>`;
            }).join('');
        }

        /* ── LEFT TAG FILTER (multi-select) ── */
        document.getElementById('filters').addEventListener('click', e => {
            const btn = e.target.closest('.tag');
            if (!btn) return;
            const tag = btn.dataset.tag;
            if (activeTags.has(tag)) {
                activeTags.delete(tag);
                btn.classList.remove('active');
            } else {
                activeTags.add(tag);
                btn.classList.add('active');
                if (activeTags.size > 3) {
                    const first = activeTags.values().next().value;
                    activeTags.delete(first);
                    document.querySelector(`.tag[data-tag="${first}"]`).classList.remove('active');
                }
            }
            updateSidebar();
        });

        function updateSidebar() {
            const activeList = [...activeTags];
            const getOrder = t => {
                const ai = activeList.indexOf(t);
                return ai === 0 ? 2 : ai === 1 ? 1 : 0;
            };
            const sortBlocks = blocks => blocks.sort((a, b) => {
                const oa = getOrder(a.dataset.tag), ob = getOrder(b.dataset.tag);
                if (oa !== ob) return oa - ob;
                return TAG_ORDER.indexOf(a.dataset.tag) - TAG_ORDER.indexOf(b.dataset.tag);
            });

            document.querySelectorAll('.proj-row').forEach(row => {
                const gen = (rowGen.get(row) || 0) + 1;
                rowGen.set(row, gen);

                const sec = sections[+row.dataset.index];
                const tags = JSON.parse(sec.dataset.tags || '[]');
                const visible = activeTags.size === 0 || [...activeTags].every(t => tags.includes(t));
                row.style.display = '';
                row.classList.toggle('filtered', !visible);

                const container = row.querySelector('.proj-tags');
                const blocks = [...container.querySelectorAll('.proj-tag-block')];

                if (!visible) {
                    sortBlocks(blocks).forEach(b => { b.style.display = ''; b.style.marginRight = ''; container.appendChild(b); });
                    return;
                }

                const activeBlocks = blocks.filter(b => activeTags.has(b.dataset.tag));
                const nonActiveBlocks = blocks.filter(b => !activeTags.has(b.dataset.tag));
                const oldX = new Map();
                activeBlocks.forEach(b => oldX.set(b, b.getBoundingClientRect().left));

                const needFade = nonActiveBlocks.some(b => b.style.opacity !== '0');
                if (needFade) {
                    nonActiveBlocks.forEach(b => { b.style.transition = 'opacity 0.07s'; b.style.opacity = '0'; });
                }

                setTimeout(() => {
                    if (rowGen.get(row) !== gen) return;

                    sortBlocks(blocks).forEach(b => { b.style.display = ''; b.style.marginRight = ''; container.appendChild(b); });

                    if (activeBlocks.length === 0) {
                        blocks.forEach(b => { b.style.opacity = ''; });
                        return;
                    }

                    if (activeTags.size === 1) {
                        const oldActiveX = oldX.get(activeBlocks[0]) ?? 0;
                        const newActiveX = activeBlocks[0].getBoundingClientRect().left;
                        const groupDx = oldActiveX - newActiveX;
                        blocks.forEach(b => {
                            b.style.transition = 'none';
                            b.style.transform = `translateX(${groupDx}px)`;
                            b.style.opacity = '1';
                        });
                        requestAnimationFrame(() => requestAnimationFrame(() => {
                            if (rowGen.get(row) !== gen) return;
                            blocks.forEach(b => { b.style.transition = 'transform 0.25s ease'; b.style.transform = ''; });
                            setTimeout(() => {
                                if (rowGen.get(row) !== gen) return;
                                blocks.forEach(b => { b.style.transition = ''; b.style.transform = ''; b.style.opacity = ''; });
                            }, 290);
                        }));
                    } else {
                        // Ensure active blocks are visible — a previous stale fade may have set them to opacity 0
                        activeBlocks.forEach(b => { b.style.transition = 'none'; b.style.opacity = ''; });
                        // FLIP each active block
                        activeBlocks.forEach(b => {
                            const dx = (oldX.get(b) ?? 0) - b.getBoundingClientRect().left;
                            if (Math.abs(dx) > 0.5) {
                                b.style.transition = 'none';
                                b.style.transform = `translateX(${dx}px)`;
                                requestAnimationFrame(() => requestAnimationFrame(() => {
                                    if (rowGen.get(row) !== gen) return;
                                    b.style.transition = 'transform 0.2s ease';
                                    b.style.transform = '';
                                    setTimeout(() => {
                                        if (rowGen.get(row) !== gen) return;
                                        b.style.transition = '';
                                    }, 240);
                                }));
                            }
                        });
                        blocks.filter(b => !activeTags.has(b.dataset.tag)).forEach(b => { b.style.opacity = ''; });
                    }
                }, needFade ? 80 : 10);
            });
        }

        /* ── OPEN / CLOSE COLUMNS ── */
        function openCols() {
            const c1 = document.getElementById('col-1');
            const c2 = document.getElementById('col-2');
            c1.classList.remove('about');
            c2.classList.remove('about');
            c1.classList.add('open');
            c2.classList.add('open');
            const h = document.getElementById('handle-1');
            h.style.display = '';
            if (window.innerWidth <= 768) {
                setTimeout(() => { h.style.display = 'none'; }, 350);
            }
        }

        function closeCols() {
            const c1 = document.getElementById('col-1');
            const c2 = document.getElementById('col-2');
            const h = document.getElementById('handle-1');
            h.style.display = '';
            c1.classList.remove('open', 'about');
            c2.classList.remove('open', 'about');
            c1.style.width = '';
            c2.style.width = '';
            setTimeout(() => { h.style.display = 'none'; }, 350);
        }

        function openAboutCols() {
            const c1 = document.getElementById('col-1');
            const c2 = document.getElementById('col-2');
            const h = document.getElementById('handle-1');
            c1.classList.remove('open');
            c2.classList.remove('open');
            c1.classList.add('about');
            c2.classList.add('about');
            h.style.display = '';
            setTimeout(() => { h.style.display = 'none'; }, 350);
        }

        /* ── OPEN PROJECT ── */
        function openProject(i) {
            if (activeIndex === i) { reset(); return; }
            activeIndex = i;

            const c2 = document.getElementById('col-2');
            const caseEmpty = document.getElementById('case-empty');

            // If about was open, keep it visible during transition so it clips out naturally
            if (caseEmpty.style.display !== 'none') {
                caseEmpty.style.width = c2.offsetWidth + 'px';
                caseEmpty.style.position = 'absolute';
                caseEmpty.style.top = '0';
                caseEmpty.style.left = '0';
                setTimeout(() => {
                    caseEmpty.style.display = 'none';
                    caseEmpty.style.width = '';
                    caseEmpty.style.position = '';
                    caseEmpty.style.top = '';
                    caseEmpty.style.left = '';
                }, 360);
            } else {
                caseEmpty.style.display = 'none';
            }

            openCols();

            document.querySelectorAll('.proj-row').forEach(r =>
                r.classList.toggle('active', +r.dataset.index === i));

            document.getElementById('case-title').textContent = sections[i].dataset.name;

            sections.forEach(s => s.style.display = 'none');
            sections[i].style.display = 'block';

            document.getElementById('case-topbar').style.display = '';
            document.getElementById('header-about').style.display = 'none';

            filterCase('all');
            c2.scrollTop = 0;
        }

        /* ── CASE FILTER (text / images / all) ── */
        function filterCase(type) {
            document.querySelectorAll('.case-filter').forEach(b =>
                b.classList.toggle('active', b.dataset.filter === type));
            if (activeIndex === null) return;
            sections[activeIndex].querySelectorAll('.block').forEach(block => {
                const t = block.dataset.type;
                const visible = type === 'all' || t === type || (type === 'text' && t === 'credits');
                block.classList.toggle('hidden', !visible);
            });
        }

        /* ── ABOUT ── */
        function openAbout() {
            previousIndex = activeIndex;
            activeIndex = null;
            openAboutCols();
            document.querySelectorAll('.proj-row').forEach(r => r.classList.remove('active'));
            sections.forEach(s => s.style.display = 'none');
            document.getElementById('case-topbar').style.display = 'none';
            document.getElementById('header-about').style.display = 'none';
            document.getElementById('case-empty').style.display = 'block';
            fetchAbout().then(populateAbout);
        }

        function closeAbout() {
            if (previousIndex !== null) {
                openProject(previousIndex);
            } else {
                reset();
            }
        }

        /* ── RESET ── */
        function reset() {
            activeIndex = null;

            const c2 = document.getElementById('col-2');
            const caseEmpty = document.getElementById('case-empty');

            // Keep visible col-2 content alive during transition so it clips out naturally
            if (caseEmpty.style.display !== 'none') {
                caseEmpty.style.width = c2.offsetWidth + 'px';
                setTimeout(() => {
                    caseEmpty.style.display = 'none';
                    caseEmpty.style.width = '';
                }, 360);
            } else {
                const activeSection = sections.find(s => s.style.display !== 'none');
                if (activeSection) {
                    activeSection.style.width = c2.offsetWidth + 'px';
                    setTimeout(() => {
                        activeSection.style.display = 'none';
                        activeSection.style.width = '';
                    }, 360);
                    sections.forEach(s => { if (s !== activeSection) s.style.display = 'none'; });
                } else {
                    sections.forEach(s => s.style.display = 'none');
                }
                caseEmpty.style.display = 'none';
            }

            closeCols();
            document.querySelectorAll('.proj-row').forEach(r => r.classList.remove('active'));
            document.getElementById('case-topbar').style.display = 'none';
            document.getElementById('header-about').style.display = '';
            activeTags.clear();
            document.querySelectorAll('.tag').forEach(t => t.classList.remove('active'));
            updateSidebar();
        }

        /* ── RESIZE HANDLE ── */
        (function () {
            const handle = document.getElementById('handle-1');
            const left = document.getElementById('col-1');
            const right = document.getElementById('col-2');
            let drag = false, startX = 0, startL = 0;

            handle.addEventListener('mousedown', e => {
                if (!right.offsetWidth) return;
                drag = true; startX = e.clientX; startL = left.offsetWidth;
                handle.style.background = 'rgba(0,0,0,0.08)';
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
                e.preventDefault();
            });
            document.addEventListener('mousemove', e => {
                if (!drag) return;
                const total = left.offsetWidth + right.offsetWidth;
                const minPx = total * 0.20;
                const maxPx = total * 0.80;
                const newLeft = Math.min(maxPx, Math.max(minPx, startL + e.clientX - startX));
                left.style.width = newLeft + 'px';
                right.style.width = (total - newLeft) + 'px';
                left.style.transition = right.style.transition = 'none';
            });
            document.addEventListener('mouseup', () => {
                if (!drag) return; drag = false;
                handle.style.background = '';
                document.body.style.cursor = document.body.style.userSelect = '';
                left.style.transition = right.style.transition = '';
            });
        })();

        function resetTagBlockOpacity() {
            document.querySelectorAll('.proj-tag-block').forEach(block => {
                block.style.opacity = '';
            });
        }

        if (window.matchMedia('(hover: hover)').matches) {
            document.querySelectorAll('.tag').forEach(tag => {
                tag.addEventListener('mouseenter', () => {
                    if (tag.classList.contains('active')) return;
                    const t = tag.dataset.tag;
                    document.querySelectorAll('.proj-tag-block').forEach(block => {
                        const bt = block.dataset.tag;
                        block.style.opacity = (bt === t || activeTags.has(bt)) ? '1' : '0';
                    });
                });
                tag.addEventListener('mouseleave', () => {
                    resetTagBlockOpacity();
                });
            });
        }

        init();
    </script>

</body>
